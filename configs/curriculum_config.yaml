curriculum:
  train_memorized_threshold: 0.95
  val_transition_threshold: 0.15
  val_generalized_threshold: 0.90

  patience: 3

  level_configs:
    1:
      base_weight_decay: 1.0
      max_weight_decay: 2.0
      is_grokking_task: true
      val_generalized_threshold: 0.90
    2:
      base_weight_decay: 1.0
      max_weight_decay: 2.0
      is_grokking_task: true
      val_generalized_threshold: 0.90
    3:
      base_weight_decay: 0.01
      max_weight_decay: 0.05
      is_grokking_task: false
      val_generalized_threshold: 0.85
    4:
      base_weight_decay: 0.01
      max_weight_decay: 0.05
      is_grokking_task: false
      val_generalized_threshold: 0.85

  plateau:
    stagnation_window: 10
    min_norm_drop_rate: 0.05
    min_norm_floor: 26.0
    max_steps_in_plateau: 10000

  interventions:
    weight_decay_multiplier: 1.3
    max_weight_decay: 2.0
    lr_decay_on_stagnation: 0.8
    cooldown_steps: 12

  equilibrium_trap:
    stagnation_window: 10
    loss_epsilon: 0.008
    em_epsilon: 0.04